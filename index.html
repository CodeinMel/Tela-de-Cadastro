<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        #conteudo {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(245, 172, 241, 0.918);
            text-align: center;
            width: 300px;
        }
        h1 {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0; 
        }

        h1 img {
            max-width: 300px; 
            height: auto;   
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ffc2f7;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #f374ed;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #ff99fa;
        }
        .form-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
        }
        .form-links a {
            color: #f374ed;
            text-decoration: none;
        }
        .form-links a:hover {
            text-decoration: underline;
            color: #ff99fa;
        }
    </style>
</head>
<body>

<div id="conteudo">
    <h2>☆ LOGIN ☆</h2>
    
    <h1>
        <img src="fotos/hk.gif" alt="imagem da pag inicial">
    </h1>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="email">E-Mail:</label>
            <input type="email" id="email" placeholder="Insira seu e-mail:" name="email" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Insira sua senha:" name="senha" required>
        </div>

        <button type="submit">Entrar</button>

        <div class="form-links">
            <a href="#">Esqueceu sua senha?</a>
            <a href="#">Não tem uma conta? Cadastre-se</a>
        </div>
    </form>
</div>

</body>
</html>
